<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Signal — Journal</title>
<script>
  // Blocking, runs before first paint: apply the saved theme immediately so switching to light
  // mode doesn't flash the dark theme for a frame first on the next page load.
  try { if (localStorage.getItem('mm_theme') === 'light') { document.documentElement.classList.add('light-theme'); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', '#F5EEDD'); } } catch(e){}
</script>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" href="assets/icons/icon-32.png">
<meta name="theme-color" content="#15140F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Signal">
</head>
<body>
<div class="shell" id="shell">

  <aside class="sidebar" id="sidebarMount" data-active="notes"></aside>

  <main class="main">
    <div class="page-eyebrow">Every day, briefly</div>
    <div class="page-head sticky-head">
      <h1 class="page-title">Journal</h1>
    </div>
    <p class="page-desc">Every note you've written on the Today page, most recent first.</p>

    <div class="journal-grid" id="journalGrid"></div>
  </main>
</div>

<script src="nav.js"></script>
<script src="data.js"></script>
<script src="richtext.js"></script>
<script src="journal.js"></script>
</body>
</html>
