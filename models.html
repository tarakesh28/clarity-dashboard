<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal — All Mental Models</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell" id="shell">

  <aside class="sidebar" id="sidebarMount" data-active="models"></aside>

  <main class="main">
    <div class="page-eyebrow">The library</div>
    <div class="page-head sticky-head">
      <div class="page-title-row" style="justify-content: space-between; align-items: center;">
        <h1 class="page-title">All Mental Models</h1>
        <div class="models-page-head-actions">
          <button class="ghost-btn" id="unpinAllBtn">Unpin all</button>
        </div>
      </div>
    </div>
    <p class="page-desc">Every model kept here, in one place. Click one to read it and add your own notes underneath. Pin up to two to show them on Today.</p>

    <div class="models-grid full" id="fullModelsGrid"></div>

  </main>
</div>

<!-- add-model modal -->
<div class="modal-overlay" id="addModelOverlay" style="display:none;">
  <div class="modal">
    <h3>New mental model</h3>
    <label>Image</label>
    <div class="model-form-preview" id="modelImgPreview">Choose an image below</div>
    <input type="file" id="modelImgInput" accept="image/*">
    <label>Title</label>
    <input type="text" id="modelTitleInput" placeholder="e.g. Inversion">
    <label>Description</label>
    <textarea id="modelCaptionInput" placeholder="One or two sentences explaining the model…"></textarea>
    <label>Notes (optional)</label>
    <textarea id="modelNotesInput" placeholder="Anything else you want attached from the start…"></textarea>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="ghost-btn" id="modelCancelBtn" type="button">Cancel</button>
      <button class="submit" id="modelSaveBtn">Add model</button>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script src="models-data.js"></script>
<script src="data.js"></script>
<script>
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function renderGrid() {
    const grid = document.getElementById('fullModelsGrid');
    const models = Data.getModels();
    const pinnedCount = models.filter(m => m.pinned).length;
    grid.innerHTML = '';

    models.forEach(m => {
      const card = document.createElement('a');
      card.className = 'model-card';
      card.href = `model.html?slug=${encodeURIComponent(m.slug)}`;
      const pinHidden = !m.pinned && pinnedCount >= 2;
      card.innerHTML = `
        <div class="frame"><img src="${m.img}" alt="${escapeHtml(m.title)}"></div>
        <div class="cap"><h3>${escapeHtml(m.title)}</h3><p>${escapeHtml(m.caption)}</p></div>
        <button type="button" class="pin-btn${m.pinned ? ' pinned' : ''}${pinHidden ? ' hidden-btn' : ''}" data-slug="${m.slug}" title="${m.pinned ? 'Unpin' : 'Pin to Today'}">📌</button>
      `;
      card.querySelector('.pin-btn').addEventListener('click', (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        const ok = Data.setModelPinned(m.slug, !m.pinned);
        if (!ok) { alert('Only 2 models can be pinned at once — unpin one first.'); return; }
        renderGrid();
      });
      grid.appendChild(card);
    });

    const addCard = document.createElement('div');
    addCard.className = 'model-card add-new';
    addCard.innerHTML = '<div class="frame"><span class="plus">+</span></div><div class="cap"><h3>Add a new model</h3><p>Image, title, and a short description</p></div>';
    addCard.addEventListener('click', openAddModal);
    grid.appendChild(addCard);
  }

  document.getElementById('unpinAllBtn').addEventListener('click', () => {
    Data.unpinAllModels();
    renderGrid();
  });

  // ---- add-model modal ----
  let pickedImageDataUrl = null;
  function openAddModal() {
    document.getElementById('modelTitleInput').value = '';
    document.getElementById('modelCaptionInput').value = '';
    document.getElementById('modelNotesInput').value = '';
    document.getElementById('modelImgInput').value = '';
    pickedImageDataUrl = null;
    document.getElementById('modelImgPreview').innerHTML = 'Choose an image below';
    document.getElementById('addModelOverlay').style.display = 'flex';
    document.getElementById('modelTitleInput').focus();
  }
  function closeAddModal() { document.getElementById('addModelOverlay').style.display = 'none'; }
  document.getElementById('modelCancelBtn').addEventListener('click', closeAddModal);
  document.getElementById('addModelOverlay').addEventListener('click', (e) => { if (e.target.id === 'addModelOverlay') closeAddModal(); });

  document.getElementById('modelImgInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pickedImageDataUrl = reader.result;
      document.getElementById('modelImgPreview').innerHTML = `<img src="${pickedImageDataUrl}">`;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('modelSaveBtn').addEventListener('click', () => {
    const title = document.getElementById('modelTitleInput').value.trim();
    const caption = document.getElementById('modelCaptionInput').value.trim();
    const notes = document.getElementById('modelNotesInput').value.trim();
    if (!title) { alert('Give it a title.'); return; }
    if (!caption) { alert('Add a short description.'); return; }
    if (!pickedImageDataUrl) { alert('Choose an image.'); return; }
    const model = Data.addModel({ title, img: pickedImageDataUrl, caption });
    if (notes) Data.addModelNote(model.slug, notes);
    closeAddModal();
    renderGrid();
  });

  renderGrid();
</script>
</body>
</html>
