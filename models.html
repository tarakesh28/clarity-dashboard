<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Signal — Mental Models</title>
<script>
  // Blocking, runs before first paint: apply the saved theme immediately so switching to light
  // mode doesn't flash the dark theme for a frame first on the next page load.
  try { if (localStorage.getItem('mm_theme') === 'light') { document.documentElement.classList.add('light-theme'); var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', '#F5EEDD'); } } catch(e){}
</script>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" href="assets/icons/icon-32.png">
<meta name="theme-color" content="#15140F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Signal">
</head>
<body>
<div class="shell" id="shell">

  <aside class="sidebar" id="sidebarMount" data-active="models"></aside>

  <main class="main">
    <div class="page-eyebrow">The library</div>
    <div class="page-head sticky-head">
      <div class="page-title-row" style="justify-content: space-between; align-items: center;">
        <h1 class="page-title">Mental Models</h1>
        <div class="models-page-head-actions">
          <button class="ghost-btn icon-only-btn" id="modelsAddBtn" type="button" title="Add a new mental model">+</button>
          <button class="ghost-btn icon-only-btn" id="modelsSearchToggleBtn" type="button" title="Search mental models">🔍</button>
        </div>
      </div>
    </div>
    <div class="page-desc-row">
      <p class="page-desc">Every model kept here, in one place. Click one to read it and add your own notes underneath. Pin up to two to show them on Today.</p>
      <button class="ghost-btn" id="unpinAllBtn">Unpin all</button>
    </div>

    <div id="modelsSearchWrap" style="display:none;">
      <div class="search-box" style="margin-top:0;">
        <input type="text" id="modelsSearchInput" placeholder="Search mental models by title or description…">
        <button id="modelsSearchBtn">Search</button>
      </div>
    </div>

    <div class="models-grid full" id="fullModelsGrid"></div>

  </main>
</div>

<!-- add-model modal -->
<div class="modal-overlay" id="addModelOverlay" style="display:none;">
  <div class="modal">
    <h3>New mental model</h3>
    <label>Image</label>
    <div class="model-form-preview" id="modelImgPreview">Choose an image below</div>
    <input type="file" id="modelImgInput" accept="image/*">
    <label>Title</label>
    <input type="text" id="modelTitleInput" placeholder="e.g. Inversion">
    <label>Description</label>
    <textarea id="modelCaptionInput" placeholder="One or two sentences explaining the model…"></textarea>
    <label>Notes (optional)</label>
    <textarea id="modelNotesInput" placeholder="Anything else you want attached from the start…"></textarea>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="ghost-btn" id="modelCancelBtn" type="button">Cancel</button>
      <button class="submit" id="modelSaveBtn">Add model</button>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script src="models-data.js"></script>
<script src="data.js"></script>
<script>
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  let modelsSearchQuery = '';
  function renderGrid() {
    const grid = document.getElementById('fullModelsGrid');
    const allModels = Data.getModels();
    // Pin-limit check must stay based on the full, unfiltered list — otherwise searching for
    // something could hide an already-pinned model and let a 3rd get pinned by mistake.
    const pinnedCount = allModels.filter(m => m.pinned).length;
    let models = allModels;
    if (modelsSearchQuery) {
      // description (caption) included per feedback — it's a plain substring check on text
      // that's already loaded in memory, nothing heavy about it.
      models = models.filter(m => m.title.toLowerCase().includes(modelsSearchQuery) || (m.caption || '').toLowerCase().includes(modelsSearchQuery));
    }
    grid.innerHTML = '';

    models.forEach(m => {
      const card = document.createElement('a');
      card.className = 'model-card';
      card.href = `model.html?slug=${encodeURIComponent(m.slug)}`;
      const pinHidden = !m.pinned && pinnedCount >= 2;
      card.innerHTML = `
        <div class="frame"><img src="${m.img}" alt="${escapeHtml(m.title)}"></div>
        <div class="cap"><h3>${escapeHtml(m.title)}</h3><p>${escapeHtml(m.caption)}</p></div>
        <button type="button" class="pin-btn${m.pinned ? ' pinned' : ''}${pinHidden ? ' hidden-btn' : ''}" data-slug="${m.slug}" title="${m.pinned ? 'Unpin' : 'Pin to Today'}">📌</button>
      `;
      card.querySelector('.pin-btn').addEventListener('click', (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        const ok = Data.setModelPinned(m.slug, !m.pinned);
        if (!ok) { alert('Only 2 models can be pinned at once — unpin one first.'); return; }
        renderGrid();
      });
      grid.appendChild(card);
    });

    const addCard = document.createElement('div');
    addCard.className = 'model-card add-new';
    addCard.innerHTML = '<div class="frame"><span class="plus">+</span></div><div class="cap"><h3>Add a new model</h3><p>Image, title, and a short description</p></div>';
    addCard.addEventListener('click', openAddModal);
    grid.appendChild(addCard);
  }

  document.getElementById('unpinAllBtn').addEventListener('click', () => {
    Data.unpinAllModels();
    renderGrid();
  });

  document.getElementById('modelsAddBtn').addEventListener('click', openAddModal);

  document.getElementById('modelsSearchToggleBtn').addEventListener('click', () => {
    const wrap = document.getElementById('modelsSearchWrap');
    const opening = wrap.style.display === 'none';
    wrap.style.display = opening ? 'block' : 'none';
    if (opening) {
      document.getElementById('modelsSearchInput').focus();
    } else {
      document.getElementById('modelsSearchInput').value = '';
      modelsSearchQuery = '';
      renderGrid();
    }
  });
  function runModelsSearch() {
    modelsSearchQuery = document.getElementById('modelsSearchInput').value.trim().toLowerCase();
    renderGrid();
  }
  document.getElementById('modelsSearchBtn').addEventListener('click', runModelsSearch);
  document.getElementById('modelsSearchInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') runModelsSearch(); });

  // ---- add-model modal ----
  let pickedImageDataUrl = null;
  function openAddModal() {
    document.getElementById('modelTitleInput').value = '';
    document.getElementById('modelCaptionInput').value = '';
    document.getElementById('modelNotesInput').value = '';
    document.getElementById('modelImgInput').value = '';
    pickedImageDataUrl = null;
    document.getElementById('modelImgPreview').innerHTML = 'Choose an image below';
    document.getElementById('addModelOverlay').style.display = 'flex';
    document.getElementById('modelTitleInput').focus();
  }
  function closeAddModal() { document.getElementById('addModelOverlay').style.display = 'none'; }
  document.getElementById('modelCancelBtn').addEventListener('click', closeAddModal);
  document.getElementById('addModelOverlay').addEventListener('click', (e) => { if (e.target.id === 'addModelOverlay') closeAddModal(); });

  // Full-size phone photos (often several MB each) stored raw would eat through localStorage's
  // ~5-10MB per-origin budget in just a couple of images — shared with every other bit of app
  // data. Downscaled here to a cap generous enough to still look sharp in the full-viewport
  // lightbox zoom on a large monitor, re-encoded as JPEG. Never upscales a smaller image.
  const MODEL_IMG_MAX_DIM = 1920;
  const MODEL_IMG_QUALITY = 0.85;
  function resizeImageFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          const scale = Math.min(1, MODEL_IMG_MAX_DIM / Math.max(width, height));
          width = Math.round(width * scale);
          height = Math.round(height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', MODEL_IMG_QUALITY));
        };
        img.onerror = () => reject(new Error('Could not read that image.'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('Could not read that file.'));
      reader.readAsDataURL(file);
    });
  }
  document.getElementById('modelImgInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      pickedImageDataUrl = await resizeImageFile(file);
      document.getElementById('modelImgPreview').innerHTML = `<img src="${pickedImageDataUrl}">`;
    } catch (err) {
      alert('Could not process that image — try a different file.');
      console.error(err);
    }
  });

  document.getElementById('modelSaveBtn').addEventListener('click', () => {
    const title = document.getElementById('modelTitleInput').value.trim();
    const caption = document.getElementById('modelCaptionInput').value.trim();
    const notes = document.getElementById('modelNotesInput').value.trim();
    if (!title) { alert('Give it a title.'); return; }
    if (!caption) { alert('Add a short description.'); return; }
    if (!pickedImageDataUrl) { alert('Choose an image.'); return; }
    const model = Data.addModel({ title, img: pickedImageDataUrl, caption });
    if (notes) Data.addModelNote(model.slug, notes);
    closeAddModal();
    renderGrid();
  });

  renderGrid();
</script>
</body>
</html>
